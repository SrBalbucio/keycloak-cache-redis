# Reference topology: Valkey/Redis master + 2 sentinels (no Keycloak nodes).
# Point Keycloak at:
#   KC_SPI_REDIS_CONNECTION_DEFAULT_MODE=sentinel
#   KC_SPI_REDIS_CONNECTION_DEFAULT_NODES=sentinel1:26379,sentinel2:26379
#   KC_SPI_REDIS_CONNECTION_DEFAULT_MASTER_NAME=mymaster

volumes:
  redis_data:
    driver: local

services:
  redis-master:
    image: valkey/valkey:8.1.5
    command: >
      valkey-server
      --appendonly yes
      --protected-mode no
    volumes:
      - redis_data:/data

  sentinel1:
    image: valkey/valkey:8.1.5
    depends_on:
      - redis-master
    entrypoint: >
      bash -c 'echo "port 26379
      sentinel resolve-hostnames yes
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1" > /tmp/sentinel.conf
      && valkey-sentinel /tmp/sentinel.conf'
    ports:
      - "26379:26379"

  sentinel2:
    image: valkey/valkey:8.1.5
    depends_on:
      - redis-master
    entrypoint: >
      bash -c 'echo "port 26379
      sentinel resolve-hostnames yes
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1" > /tmp/sentinel.conf
      && valkey-sentinel /tmp/sentinel.conf'
    ports:
      - "26380:26379"
